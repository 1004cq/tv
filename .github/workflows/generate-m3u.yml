name: Generate Best M3U

on:
  schedule:
    # 每天凌晨 3:00 UTC（北京时间 11:00）
    - cron: '0 3 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate best.m3u
        run: node server/generate.js

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add best.m3u
          git diff --staged --quiet || git commit -m "chore: update best.m3u"
          git push
